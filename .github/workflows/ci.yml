name: Psycopg dialect CI

on:
  push:
    branches: ["feature/sqlalchemy-dialect-psycopg2-psycopg3"]
  pull_request:
    branches: ["feature/sqlalchemy-dialect-psycopg2-psycopg3"]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    env:
      GAUSSDB_IMPL: python
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          # PostgreSQL libpq is used only for offline DBAPI import checks.
          # Live GaussDB acceptance requires the matched product client libs.
          sudo apt-get update
          sudo apt-get install --yes libpq5
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          # Only a DBAPI import fixture for offline unit tests, not the
          # GaussDB product driver used for live acceptance testing.
          python -m pip install psycopg2-binary gaussdb==1.0.4

      - name: Run unit tests
        run: pytest -m "not integration"

      - name: Build wheel
        run: |
          python -m pip install build
          python -m build --wheel

      - name: Check delivered wheel checksum
        working-directory: packages
        run: sha256sum -c SHA256SUMS

      - name: Check delivered wheel source and metadata
        run: python tools/verify_wheel.py
